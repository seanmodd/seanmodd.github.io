name: Validate Pckup design-system migration guide

on:
  pull_request:
    paths:
      - "pckup-design-system-migration-guide/**"
      - ".github/workflows/validate-pckup-design-system-migration-guide.yml"
  push:
    branches:
      - master
    paths:
      - "pckup-design-system-migration-guide/**"
      - ".github/workflows/validate-pckup-design-system-migration-guide.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check pckup-design-system-migration-guide/phase-data-1.js
          node --check pckup-design-system-migration-guide/phase-data-2.js
          node --check pckup-design-system-migration-guide/phase-data-3.js
          node --check pckup-design-system-migration-guide/site.js
      - name: Validate phase payload and public assets
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const zlib = require('node:zlib');

          const root = 'pckup-design-system-migration-guide';
          const partFiles = ['phase-data-1.js', 'phase-data-2.js', 'phase-data-3.js'];
          const encoded = partFiles.map((file) => {
            const source = fs.readFileSync(path.join(root, file), 'utf8');
            const match = source.match(/'([^']*)'/);
            if (!match) throw new Error(`Missing compressed payload in ${file}`);
            return match[1];
          }).join('');

          const phases = JSON.parse(
            zlib.gunzipSync(Buffer.from(encoded, 'base64')).toString('utf8'),
          );

          if (!Array.isArray(phases) || phases.length !== 17) {
            throw new Error(`Expected 17 phases, found ${phases?.length ?? 0}`);
          }

          phases.forEach((phase, index) => {
            if (phase.id !== `P${index}`) throw new Error(`Unexpected phase id ${phase.id}`);
            if (phase.number !== index) throw new Error(`Unexpected phase number ${phase.number}`);
            if (!phase.title || !phase.summary || !phase.category || !phase.risk) {
              throw new Error(`Incomplete metadata for ${phase.id}`);
            }
            if (!Array.isArray(phase.outputs) || phase.outputs.length === 0) {
              throw new Error(`No outputs for ${phase.id}`);
            }
            if (!Array.isArray(phase.gates) || phase.gates.length === 0) {
              throw new Error(`No exit gates for ${phase.id}`);
            }
            if (typeof phase.prompt !== 'string' || phase.prompt.length < 900) {
              throw new Error(`Prompt is too short for ${phase.id}`);
            }
          });

          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
          const assets = [...html.matchAll(/(?:href|src)="\.\/([^\"]+)"/g)]
            .map((match) => match[1]);
          for (const asset of assets) {
            if (!fs.existsSync(path.join(root, asset))) {
              throw new Error(`Missing referenced asset ${asset}`);
            }
          }

          const publicFiles = [
            'index.html',
            'README.md',
            'site-core.css',
            'site-components.css',
            'phase-data-1.js',
            'phase-data-2.js',
            'phase-data-3.js',
            'site.js',
          ];
          const publicText = publicFiles
            .map((file) => fs.readFileSync(path.join(root, file), 'utf8'))
            .join('\n');

          const banned = [
            'X7WZQGMUPIuzeaNoA7zTrF',
            'guide-meta.js',
            'guide-adapter.js',
            'phases-00-04.js',
            'phases-05-08.js',
            'phases-09-12.js',
            'app.js',
          ];
          for (const value of banned) {
            if (publicText.includes(value)) {
              throw new Error(`Banned private or stale value found: ${value}`);
            }
          }

          console.log(JSON.stringify({
            status: 'valid',
            phases: phases.length,
            firstPhase: phases[0].title,
            lastPhase: phases.at(-1).title,
            referencedAssets: assets,
          }, null, 2));
          NODE
