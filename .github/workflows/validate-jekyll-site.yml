name: Validate Jekyll site

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build public site
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: ${{ runner.temp }}/pckup-jekyll-bundle
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3
      - name: Build site
        run: bundle exec jekyll build --future
      - name: Verify finalized migration guide output
        run: |
          guide="_site/pckup-design-system-migration-guide"
          test -f "$guide/index.html"
          test -f "$guide/site-core.css"
          test -f "$guide/site-components.css"
          test -f "$guide/phase-data-1.js"
          test -f "$guide/phase-data-2.js"
          test -f "$guide/phase-data-3.js"
          test -f "$guide/site.js"
          grep -F "Migrate the existing codebase into a real, scalable design system." "$guide/index.html"
          grep -F "0 of 17 phases complete" "$guide/index.html"
          grep -F "phase-data-3.js" "$guide/index.html"
